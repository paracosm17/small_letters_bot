[project]
name = "small-letters-bot"
version = "0.1.0"
description = "Telegram bot for composing small Cyrillic text above regular text"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiogram==3.26.0",
    "aiogram-dialog==2.6.0",
    "aiohttp==3.13.5",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "environs==14.6.0",
    "redis==7.3.0",
    "SQLAlchemy==2.1.2",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["infrastructure/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
